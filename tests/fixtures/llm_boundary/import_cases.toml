# Test (b): module snippets the import scan must fail (or pass), spec req 13 as
# amendment C13 reads it. Each snippet is appended to the real file at `path`
# (or becomes a new file there), and the scan runs over src/ and scripts/ with
# that one change. `rule` is the case it must report; "" means it must pass.

[[case]]
id = "dashboard-imports-research"
path = "src/tradepartner/dashboard/research_peek.py"
source = "import tradepartner.research\n"
rule = "i"

