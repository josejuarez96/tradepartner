[project]
name = "tradepartner"
version = "0.0.0"
description = "Personal trading research system: point-in-time data, honest backtests, paper trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py==0.44.0",
    "duckdb>=1.5.5",
    "edgartools==5.58.0",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "streamlit>=1.64.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=3.0.5.260914",
    "types-python-dateutil>=2.9.0.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ"]  # DTZ: no naive datetimes

[tool.mypy]
strict = true
files = ["src"]

# Libraries with no inline types and no stubs on PyPI (pandas is covered by
# the pandas-stubs dev dependency instead). Each is used only behind our own
# thin wrappers (calendar.py, and later the adapters), so the untyped
# surface never leaks past this module boundary.
[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
