name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR branches cancel superseded runs. Main never does, so every merge gets a completed run
# (#198): one group per commit, since a shared group would still drop a pending run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Hygiene (pre-commit hooks)
        run: SKIP=no-commit-to-branch,ruff-check,ruff-format uv run pre-commit run --all-files
      - name: Fragments (STATUS/CHANGELOG entries are well-formed files)
        run: python3 scripts/fragments.py check
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  claims:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: One team and one open PR per plan task
        run: python3 scripts/team.py check-claims --pr ${{ github.event.pull_request.number }}
