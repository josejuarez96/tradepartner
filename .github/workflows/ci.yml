name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Hygiene (pre-commit hooks)
        run: SKIP=no-commit-to-branch,ruff-check,ruff-format uv run pre-commit run --all-files
      - name: Fragments (STATUS/CHANGELOG entries are well-formed files)
        run: python3 scripts/fragments.py check
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      # A PR that touches no code, tests, scripts, deps or CI skips pytest (same rule as
      # ready_pr.py). Gated per step, not with `paths:`, so `checks` still reports; anything
      # but an explicit "no" runs the tests.
      - name: Test scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            needed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | python3 scripts/ready_pr.py --tests-needed)
          else
            needed=yes
          fi
          echo "Tests needed: $needed"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Tests
        if: steps.scope.outputs.needed != 'no'
        run: uv run pytest

  claims:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: One team and one open PR per plan task
        run: python3 scripts/team.py check-claims --pr ${{ github.event.pull_request.number }}
