default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch   # blocks local commits to main
        args: [--branch, main]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/(alpaca|edgar)/   # recorded raw payloads stay byte-exact (T3)
      - id: trailing-whitespace
        exclude: ^tests/fixtures/(alpaca|edgar)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-push-to-main
        name: block pushes to main
        entry: scripts/no_push_to_main.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: doc-size-budget
        name: doc size budgets (warn only)
        entry: uv run python scripts/doc_check.py size
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|docs/STATUS\.md|\.claude/(agents|skills)/|docs/ways-of-working/)
        verbose: true   # always exits 0; verbose shows the WARN lines (#1751)
      - id: doc-citations
        name: doc citations resolve
        entry: uv run python scripts/doc_check.py cite
        language: system
        pass_filenames: false
        files: ^(docs/(plans|specs|decisions)/|docs/research/claims\.toml|src/|tests/)   # CI's pre-commit step runs this on docs-only PRs too (#1751)
