cik = "0000006769"
ticker = "APA"
first = 2020-06-09
last = 2021-02-26
cite = { kind = "accession", ref = "0001193125-20-163501", date = 2020-06-08 }

[[history.bars]]
cik = "0001841666"
ticker = "APA"
first = 2021-03-01
