predecessor_cik = "0000006769"
cite = { kind = "accession", ref = "0001193125-21-063695", date = 2021-03-01 }

# Nasdaq's Form 25-NSE for Apache's common stock, signed 2021-03-04 ("ON 3/2/2021 -
# APACHE CORPORATION REORGANIZED AS APA CORPORATION"): the Nasdaq line ends with the
# reorganisation. The form states no effective date.
[[history.input]]
kind = "25-nse"
cik = "0000006769"
date = 2021-03-04
exchange = "Nasdaq"
ticker = "APA"
cite = { kind = "accession", ref = "0001354457-21-000304", date = 2021-03-04 }

# Bars: Apache traded on Nasdaq from the session after the Form 25s (2020-06-09)
# through the last session before the reorganisation (Friday 2021-02-26); APA
# Corp from 2021-03-01 "on an uninterrupted basis" (8-K12B).
