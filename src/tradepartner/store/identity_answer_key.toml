# The identity answer key (#3275, ADR 0029, T394): hard security histories whose
# true outcome is known from sources OUTSIDE this repo. CHECK ONLY: it judges
# the resolver and is never read by a universe, signal, backtest or research
# module (a source scan in tests/lookahead/test_check_only_inputs.py pins that).
#
# Format (store/identity_answer_key.py): [[history]] with [[history.input]]
# (events that reach the store), [[history.bars]] (sessions that had bars) and
# [[history.expected]] (outcomes). Entities are CIKs, never store ids. Every
# fact has cite = {kind, ref, date}: kind is accession | exchange_notice |
# company_notice | press_release; ref is an EDGAR accession or an https URL;
# date is the cited document's date. A fact with no citation, or a citation
# dated after the check date, is refused by the loader.
#
# Expected outcomes are written from the cited source alone, never from the
# resolver's output or any stored row.

[[history]]
id = "apa-apache-holdco-2021"
title = "Apache / APA Corp: NYSE and NYSE Chicago lines withdrawn in 2020 while Nasdaq stays; holdco takes the ticker 2021-03-01"

# Apache (CIK 0000006769) filed one Form 25 per exchange on 2020-06-08. The
# NYSE one says the Chicago line gets its own Form 25 and that the common stock
# stays on the Nasdaq Global Select Market.
[[history.input]]
kind = "form25"
cik = "0000006769"
date = 2020-06-08
exchange = "NYSE"
ticker = "APA"
cite = { kind = "accession", ref = "0001193125-20-163490", date = 2020-06-08 }

[[history.input]]
kind = "form25"
cik = "0000006769"
date = 2020-06-08
exchange = "NYSE Chicago"
ticker = "APA"
cite = { kind = "accession", ref = "0001193125-20-163501", date = 2020-06-08 }

# 2021-03-01: APA Corp (CIK 0001841666) is the successor issuer to Apache.
[[history.input]]
kind = "8-k12b"
cik = "0001841666"
date = 2021-03-01
exchange = "Nasdaq"
ticker = "APA"
successor_cik = "0000006769"
cite = { kind = "accession", ref = "0001193125-21-063695", date = 2021-03-01 }

# Bars: Apache traded on Nasdaq from the session after the Form 25s (2020-06-09)
# through the last session before the reorganisation (Friday 2021-02-26); APA
# Corp from 2021-03-01 "on an uninterrupted basis" (8-K12B).
[[history.bars]]
cik = "0000006769"
ticker = "APA"
first = 2020-06-09
last = 2021-02-26
cite = { kind = "accession", ref = "0001193125-20-163501", date = 2020-06-08 }

[[history.bars]]
cik = "0001841666"
ticker = "APA"
first = 2021-03-01
cite = { kind = "accession", ref = "0001193125-21-063695", date = 2021-03-01 }

[[history.expected]]
kind = "line_end"
cik = "0000006769"
exchange = "NYSE"
last = 2020-06-08
cite = { kind = "accession", ref = "0001193125-20-163490", date = 2020-06-08 }

[[history.expected]]
kind = "line_end"
cik = "0000006769"
exchange = "NYSE Chicago"
last = 2020-06-08
cite = { kind = "accession", ref = "0001193125-20-163501", date = 2020-06-08 }

# The Nasdaq line did not end: this is the fact the rehearsal copy lost (#3264).
[[history.expected]]
kind = "line_end"
cik = "0000006769"
exchange = "Nasdaq"
cite = { kind = "accession", ref = "0001193125-20-163490", date = 2020-06-08 }

[[history.expected]]
kind = "holds"
cik = "0000006769"
ticker = "APA"
first = 2020-06-09
last = 2021-02-28
cite = { kind = "accession", ref = "0001193125-21-063695", date = 2021-03-01 }

[[history.expected]]
kind = "holds"
cik = "0001841666"
ticker = "APA"
first = 2021-03-01
cite = { kind = "accession", ref = "0001193125-21-063695", date = 2021-03-01 }

[[history.expected]]
kind = "bars"
cik = "0000006769"
ticker = "APA"
first = 2020-06-09
last = 2021-02-26
cite = { kind = "accession", ref = "0001193125-20-163501", date = 2020-06-08 }

[[history.expected]]
kind = "bars"
cik = "0001841666"
ticker = "APA"
first = 2021-03-01
cite = { kind = "accession", ref = "0001193125-21-063695", date = 2021-03-01 }

