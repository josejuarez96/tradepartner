[task.T49]
what = "The journal tables in the store, append-only, at schema version 5."
why = "Every signal, decision, order, fill and outcome is a stored fact with a known_at from here on."

[task.T49b]
what = "The journal's row types and writers, and the single accessor every reader of fills goes through."
why = "Inserts only, like the trial registry; one accessor so a superseded fill is never counted twice."

[task.T49c]
what = "The journal's readers, per window and per run."
why = "Every derived state (switch, decisions, rebalances) is a query over these rows."

[task.T50]
what = "The deterministic client order id and the tests that fence the order path."
why = "Only the wrapper may submit or cancel; an id derived from the journal makes a crash unable to double an order."

[task.T51]
what = "The ledger: positions and cash rebuilt from journaled fills and adjustments, split-adjusted as of a time."
why = "The journal is the truth about what we hold; the broker is what we reconcile it against."

[task.T52]
what = "Pure functions for what a decision still needs (open, in flight, settled, closed), how much remains, and a buy's target."
why = "Re-runs and catch-ups trade only remainders; the rules must be one function of the journal, not run-time state."

[task.T52b]
what = "The residue a name carries (dust, untradable, carried) and the derived state of a rebalance (pending, executed, missed)."
why = "A window must be able to close around residues, and a rebalance nobody ran must still lapse on schedule."

[task.T53]
what = "The backtest engine's plan function made public, tracking-trial windows, and the step that turns a plan into journaled decisions."
why = "Paper plans with the same code the backtest ran, so paper and backtest can be compared honestly."

[task.T54]
what = "The risk checks on each batch of orders and the rule that sizes buys from the cash the sells raised."
why = "Position, order and exposure limits, no shorts and no borrowing, all from the window's frozen values."

[task.T55]
what = "Reconciliation: compare the ledger with the broker's positions, orders and cash, explaining only what known facts explain."
why = "Any drift the journal cannot explain halts the system rather than being papered over."

[task.T56]
what = "The wash-sale lot ledger: lots, FIFO disposals and wash-sale flags per the IRS rules from G7."
why = "Phase 6 needs it before its first taxable trade; paper fills are the only real stream to test it on."

[task.T57]
what = "Alerts stored first, then delivered to macOS notifications and optional email, with every attempt recorded."
why = "The system runs unattended; a failure nobody hears about is the worst failure."

[task.T58]
what = "Collecting order outcomes and fills from the broker without counting a fill twice, closing an order before its fills arrive, or letting a fill lag forever."
why = "A lagging fill feed must never engage the kill switch by mistake, and never leave a position out of the ledger."

[task.T59]
what = "The kill switch, derived from journal rows and engaged by faults, drawdown or the owner, plus the one run lock every command shares."
why = "A lost write or a crash must leave the switch engaged, never open; two runs must never overlap."

[task.T60]
what = "The wrapper's core: the clock pre-check, the rejection allowlist, the halt path in order, and duplicate-id replay."
why = "ADR 0007 made into code: anything unclassified halts, and a halt writes the switch row before anything else."

[task.T60b]
what = "The machinery every wrapper phase shares: switch re-read, validation, limits, skips, journaled orders before submit, acknowledgement polling."
why = "A batch that breaks a limit submits nothing, and every order is on record before the broker sees it."

[task.T60c]
what = "The wrapper's sells phase: exits and trims sized from the reconciled holding, submitted before the open."
why = "Sells fund buys and can never exceed what is held."

[task.T60d]
what = "The wrapper's buys phase: sized from cash after the sells, deferred when the cash is not there."
why = "Nothing is ever borrowed."

[task.T60e]
what = "Re-attempts for remainders only, and write-offs when a rebalance's last phase leaves a buy unfunded."
why = "No buy is ever placed twice, and a halted attempt is never mistaken for a funding shortfall."

[task.T61]
what = "Reconciliation with the store's explanations: splits, delistings, spin-offs and dividends known at the previous close."
why = "One shared check for the run, resume, stop and the reconcile command."

[task.T61b]
what = "The owner's resume: settle pending orders, reconcile, release the switch, all with a reason."
why = "After a crash or a halt nothing trades until a human has reasoned and the books agree."

[task.T62]
