# Work map: plain-English notes the cockpit shows for every piece of work.
#
# One table per node. Kinds: phase, task, issue, research, adr, plan, spec.
#   [task.T7]      a plan task            [issue.49]   a GitHub issue (not a plan task)
#   [research.<file stem>]  a report in docs/research   [adr.0003]  a decision record
#   [phase.3]      a roadmap phase        [plan.<stem>] / [spec.<stem>]  a plan or spec file
# Fields: what (one sentence, what it is), why (why it matters on the way to the MVP),
# unblocks (optional list of node ids, "kind:key", that this piece feeds).
# Plan dependencies, claims, PRs and roadmap exit criteria are read from their sources;
# only the words and the cross-cutting "unblocks" links live here.
# Add an entry when you open an issue or a research brief. The page lists the ids it is missing.

[phase.0]
what = "Repository, tooling and the rules for how agents and the owner work together."
why = "Everything after it assumes one plan, one branch per task and a reviewed PR for every change."

[phase.1]
what = "The charter and the first decisions: what success means, which stocks, which data adapters."
why = "Building without these would mean guessing at the target."

[phase.2]
what = "A local point-in-time store of prices and filings, plus the adapters that fill it."
why = "An honest backtest needs data that only knows what was knowable at the time. This is the MVP's foundation."

[phase.3]
what = "A backtester with realistic costs, a locked holdout and a registry of every trial."
why = "The MVP's first hypothesis, monthly momentum, gets tested here. Without the registry we cannot tell luck from skill."

[phase.4]
what = "Unattended paper trading with risk rules, a kill switch and a full decision journal."
why = "Six months of clean paper runs is the MVP's finish line."

[phase.5]
what = "An optional LLM memo beside each signal, only if a decision record grants it that role."
why = "Deferred: no evidence yet that it adds predictive value."

[phase.6]
what = "A small live account, about $100, under exactly the paper-trading rules."
why = "The first real money, only after the MVP has proven the process."

[task.T1]
what = "Configuration keys, dependency pins and a real trading calendar."
why = "Every threshold lives in config and every date comes from the exchange calendar, never from weekdays."

[task.T2]
what = "Thin clients that fetch raw Alpaca and EDGAR payloads, and a recorder that saves scrubbed copies as test fixtures."
why = "Tests never touch the network; they replay these recordings."

[task.T3]
what = "The owner runs the recorder with real keys and writes down what the free data sources actually allow and return."
why = "Sets the config values the parsers and the liquidity rule depend on; agents cannot do it without keys."

[task.T4]
what = "The DuckDB schema, the database layer and the shared loader tests use to build a store from CSV."
why = "Every stored fact carries a known_at timestamp from here on."

[task.T5]
what = "A hand-built universe of fictional securities covering every tricky case: splits, delistings, ticker reuse, dual classes."
why = "The no-look-ahead tests need every edge case present, on purpose."

[task.T6]
what = "Read functions that answer 'what was known as of time T', with a harness proving that truncating the store to T changes nothing."
why = "This is the mechanism that makes look-ahead impossible rather than merely discouraged."

[task.T7]
what = "The PriceSource interface and its fixture-backed implementation."
why = "Every price provider, free or paid, plugs in through this one door."

[task.T8]
what = "The FilingSource interface, its fixture implementation, and the security master that tracks which company a ticker meant on a given day."
why = "Tickers get reused; the master keeps identities straight through time."

[task.T8b]
what = "Delistings and exchange transfers, derived from filings at read time."
why = "The MVP universe must include companies that later vanished, or the backtest flatters itself."

[task.T9]
what = "Classifying each security as common stock, ETF, ADR, preferred and so on, from filing evidence."
why = "The universe is common stocks only; the rule needs a point-in-time type per listing."

[task.T10]
what = "The no-look-ahead test suite, and a deliberately broken adapter that each check must catch."
why = "Proves the guard rails bite before real data arrives."

[task.T11]
what = "Parsers that turn recorded EDGAR payloads into stored facts with provenance."
why = "Real filings feed the security master and the universe rules."

[task.T11b]
what = "The real EDGAR filing source: the quarterly index of issuer filings, stamped with acceptance times, and the company snapshot."
why = "Without it a real ingest has no filings; T11 only parsed recordings."

[task.T11c]
what = "Fetch and parse the SEC Financial Statement and Notes data sets: cover pages, per-class shares and SIC for issuer filings since 2015, cached per CIK."
why = "Per-filing downloads for every issuer are hundreds of GB; the monthly data sets carry the same facts by accession (#174)."

[task.T11d]
what = "The adapter methods that serve cover pages and SIC headers from those caches, stamped at acceptance, with per-filing downloads mainly for the newest weeks."
why = "Turns the data sets into the point-in-time listings and SIC the security master and classification read."

[task.T11e]
what = "The adapter method that serves shares outstanding: company facts plus per-class shares from the cover pages."
why = "Dual-class share counts exist only on the cover page; the universe rules need them per class."

[task.T11f]
what = "Form 25 delistings from EDGAR, the rule for a filing that fails the same way every night, and the owner's measured backfill cost."
why = "One bad filing must not block the nightly ingest; the real backfill size decides how T19 runs it."

[task.T12]
what = "Parsers that turn recorded Alpaca payloads into stored bars and corporate actions."
why = "Real prices for the backtest, stamped with when they became known."

[task.T13]
what = "The universe rules: exchange, type, market-cap rank, liquidity, price floor, all as of T."
why = "The MVP strategy trades exactly this list, rebuilt each month-end without hindsight."

[task.T14]
what = "One override test per universe config key and a check that no threshold is hardcoded."
why = "Config-driven thresholds are a non-negotiable; this proves it."

[task.T15]
what = "The survivorship gap: how many names the universe should contain that the data lacks."
why = "Phase 4's entry gate: the owner signs off on this number before paper trading."

[task.T16]
what = "Ingest one session's data from every source, idempotently, with staleness checks."
why = "The daily job that keeps the store current without an operator."

[task.T17]
what = "Backfill history in monthly chunks and resume after a failure."
why = "Years of history arrive in pieces; a crash must not mean starting over."

[task.T18]
what = "Health metrics and integrity rules over the store."
why = "The data-health page and the daily job both read these."

[task.T19]
what = "The tradepartner command line: ingest, health, dashboard, export."
why = "What the scheduler calls; the owner's main way to run the system."

[task.T20]
what = "The Broker interface and an in-memory fake broker with no risk logic."
why = "Paper and live brokers plug in here later; risk rules stay outside every broker."

[task.T21a]
what = "The Streamlit dashboard shell with a read-only database connection and empty states."
why = "The product's own UI, started early so pages land as their data does."

[task.T21]
what = "The data-health page: coverage, gaps, last update, delisted names present."
why = "Phase 2's exit requires the owner to see data health, not just trust it."

[task.T22]
what = "A runbook for scheduling the daily job on macOS, with evidence of unattended runs."
why = "The system must run without anyone watching."

[task.T23]
what = "The data-validator agent and the phase close-out report on the owner's real store."
why = "Phase 2 ends when the real store passes the same checks the fixtures do."

