# Exchange delisting-rule glossary (#1490), machine-readable twin of
# 2026-10-11-exchange-delisting-rule-glossary.md. Data only: no code reads it yet.
#
# One [[rule]] table per exchange rule cited in Form 25 exchange notices (exhibit text) of the
# departure-reason corpus (9,694 Form 25s, 2016-2026), kept while the rules together cover >= 95%
# of citations: 55 rules, 2306 of 2423 citations (95.17%). A rule counts once per
# filing, at the specificity cited (5550(b) and 5550(b)(1) are separate rows; a bare 5550(b) is
# dropped when the same notice also cites 5550(b)(1)).
#
# Fields: exchange, rule (as cited), meaning (plain words), label (under the owner rules on #963:
#   bankruptcy | compliance_delisting | instrument_retirement | merger_or_acquisition |
#   "decides nothing alone" | "depends on the notice text"), reason, quote (verbatim official text,
#   typographic quotes and line breaks normalised), url, retrieved (UTC date), count (filings),
#   verified (false when the official text could not be retrieved).

