# ===== 2026-09-25-g7-wash-sales.md =====

[[claim]]
id = "G7-1"
statement = "A loss on stock or securities is disallowed if substantially identical stock or securities are acquired within 30 days before or after the sale (a 61-day window)."
kind = "fact"
grade = "SUPPORTED"
scope = "US federal tax, IRC §1091(a), non-dealers"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Answer"
note = "Confirmed by five Tier 1 primary sources; the window crosses December 31 (Pub 550 example)."

[[claim]]
id = "G7-2"
statement = "Wash-sale triggers include buying in a fully taxable trade, acquiring a contract or option to buy (including cash-settled), buying for your IRA or Roth IRA, and a purchase by your spouse or a corporation you control."
kind = "fact"
grade = "UNGRADED"
scope = "IRC §1091, Pub 550 (2025)"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Plain-language rules (R2, R3, R5)"
note = "Quoted from Tier 1 primary sources; spouse/controlled-corporation rule is from Pub 550 only."

[[claim]]
id = "G7-3"
statement = "A disallowed loss is added to the basis of the replacement shares, except when the replacement was bought in an IRA or Roth IRA, where the loss is disallowed and the IRA basis is not increased."
kind = "fact"
grade = "UNGRADED"
scope = "IRC §1091(d), Rev. Rul. 2008-5, Pub 550"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Plain-language rules (R9, R16)"

[[claim]]
id = "G7-4"
statement = "The replacement shares' holding period includes the holding period of the shares sold at a disallowed loss."
kind = "fact"
grade = "UNGRADED"
scope = "IRC §1223(3), Pub 550"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Plain-language rules (R10)"

[[claim]]
id = "G7-5"
statement = "Holding more than 1 year makes a gain or loss long-term; the holding period starts the day after the trade date and includes the sale's trade date, using trade dates not settlement dates, and the tax year of a sale follows its trade date."
kind = "fact"
grade = "UNGRADED"
scope = "IRC §1222, Pub 550, Form 8949 instructions"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Plain-language rules (R18-R20)"

[[claim]]
id = "G7-6"
statement = "Replacement shares are matched to losses in order of acquisition (earliest first), each replacement share absorbs only one loss, and a wash-sale loss cannot offset gains on identical blocks sold the same day."
kind = "fact"
grade = "UNGRADED"
scope = "26 CFR 1.1091-1, Pub 550"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Plain-language rules (R11-R14)"

[[claim]]
id = "G7-7"
statement = "Brokers must report wash sales only when both trades are in the same account with the same CUSIP, but the loss is disallowed whether or not reported and the taxpayer must report it on Form 8949 with code W."
kind = "fact"
grade = "UNGRADED"
scope = "Form 1099-B instructions (2026), Pub 550, Form 8949 instructions (2025)"
source = "docs/research/2026-09-25-g7-wash-sales.md"
section = "Plain-language rules (R22, R23)"

[[claim]]
id = "G7-8"
statement = "A monthly-rebalanced system must keep its own lot ledger across all related accounts (taxable, IRA, Roth, spouse, controlled corporation) with CUSIP, trade date, quantity including fractions and basis, and rerun a 61-day window scan on each loss sale as later purchases arrive, including into the next tax year."
kind = "principle"
