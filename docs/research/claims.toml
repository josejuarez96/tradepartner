grade = "NOT SUPPORTED"
scope = "US, Fama-French 49 industries, value-weighted, gross, long-short"
source = "docs/research/2026-10-09-short-horizon-candidates.md"
section = "Evidence"
note = "Dai, Medhat, Novy-Marx & Rizova (2023 WP); CZ IndMom (6-month signal) post-publication 0.06%/month (t 0.18)."

[[claim]]
id = "SH-4"
statement = "Announcement-adjusted, industry-relative one-month reversal earned 0.58%/month (t 3.29) value-weighted long-short gross after decimalization (2001-2021), but its best published net version (low-volatility industry-relative reversal) earns an insignificant 0.19%/month (t 1.41)."
kind = "empirical"
grade = "MIXED"
scope = "US, monthly, long-short; gross post-2001 vs net to 2013; long-only leg not reported"
source = "docs/research/2026-10-09-short-horizon-candidates.md"
section = "Evidence"
note = "Dai et al. (2023 WP) vs Novy-Marx & Velikov (2016). Needs earnings-release dates (SH-12) and SIC (held). Large-cap price pressure half-life about 0.54 days (Hendershott & Menkveld via Medhat & Schmeling), so daily/weekly versions are out of reach at next-open fills."

