# Claims register: every decision-relevant finding in docs/research/, one entry each.
# How it is used: docs/ways-of-working/research-program.md. Agents read this file, not the
# long reports; open a report only at the section a claim names.
#
# Fields (one [[claim]] table per claim):
#   id         <PREFIX>-<n>, unique. Prefix = source report (see the section comments).
#              TP-<n> is reserved for TradePartner's own test results.
#   statement  one sentence, faithful to the source and never stronger than it
#   kind       empirical | fact (data, tooling, legal) | principle (design or governance position)
#   grade      SUPPORTED | MIXED | NOT SUPPORTED | INSUFFICIENT  (handoff §6.1, as the source graded it)
#              UNGRADED  (stated without a grade: never counts as support)
#              n/a       (principles only)
#   scope      the conditions under which the grade holds
#   source     the report; section (optional) the heading inside it
#   bears_on   optional links: adr:NNNN, hyp:<docs/hypotheses slug>, spec:<docs/specs stem>,
#              backlog:<id in hypothesis-backlog.md>
#   note       optional: caveat, conflicting claim id, verification level, superseded-by
#
# Rules: entries are faithful extracts, not new evidence. A grade changes only with new
# evidence (a newer report or a TP- result), with the old grade kept in note. Conflicting
# claims both stay and name each other. First extraction: 2026-10-03 (#620), by agents,
# from the reports as written; spot-check against the source before relying on one.

# Claims register fragment A. Grades are the source report's own; UNGRADED where the report asserts without a grade.

