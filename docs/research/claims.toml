# returns (release downloaded 2026-10-09); gross, long-short as published; unverified by a second party.

[[claim]]
id = "SH-1"
statement = "Plain one-month (and weekly) short-term reversal has no post-publication edge in large or value-weighted US stocks: the largest-500 low-turnover reversal earns 2 bp/month (1963-2018), post-decimalization reversal 0.18%/month (t 0.62), and CZ value-weighted reversal -0.05%/month (t -0.11) after 1990."
kind = "empirical"
grade = "NOT SUPPORTED"
scope = "Large-cap or value-weighted US equities, monthly sorts, gross, long-short; post-publication"
source = "docs/research/2026-10-09-short-horizon-candidates.md"
section = "Evidence"
note = "Refines QI-17 (MIXED, generic short-horizon) for our universe. Counter: De Groot, Huij & Zhou (2012) report 30-50 bp/week net in large caps to 2009, long-short."

[[claim]]
id = "SH-2"
statement = "Trading costs exceed the gross spread of high-turnover short-horizon strategies: value-weighted short-run reversal nets -1.28%/month, one-month industry momentum -0.29%/month and industry-relative reversal -0.80%/month (1963-2013), and the average anomaly earns about 4 bp/month net, post-publication, in the modern era."
kind = "empirical"
grade = "SUPPORTED"
scope = "Long-short, institutional effective-spread cost models (upward-biased after 2003); not our long-only, commission-free scale"
source = "docs/research/2026-10-09-short-horizon-candidates.md"
section = "Evidence"
note = "Novy-Marx & Velikov (RFS 2016), Chen & Velikov (JFQA 2023), Blitz et al. (FAJ 2023: break-even costs below 25 bp at 1,300-2,000% turnover). Consistent with QI-21 and G4-8."

[[claim]]
id = "SH-3"
statement = "One-month industry momentum has disappeared since decimalization: 0.09%/month (t 0.34) value-weighted long-short over 2001-2021 against 0.68%/month (t 3.57) over 1973-2021."
